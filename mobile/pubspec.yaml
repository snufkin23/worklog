name: worklog
description: "Worklog mobile app: daily work digest, tasks and blockers."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  auto_route: ^11.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  injectable: ^3.0.0
  material_ui: ^1.5.0
  riverpod_annotation: ^4.0.7

dev_dependencies:
  auto_route_generator: ^10.6.0
  build_runner: ^2.16.1
  flutter_gen_runner: ^5.13.0+1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: 4.0.1
  injectable_generator: ^3.1.3
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/

flutter_gen:
  output: lib/gen/